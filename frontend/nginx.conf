# 프론트 화면 파일을 주고, /api 요청은 백엔드 컨테이너로 넘기는 nginx 설정
server {
    listen 80;

    # npm run build 결과(dist)를 넣어 둘 폴더 (프론트 Dockerfile에서 복사)
    root /usr/share/nginx/html;
    index index.html;

    # /api 로 시작하는 요청은 백엔드(compose 서비스 이름 backend)로 넘긴다
    location /api/ {
        proxy_pass http://backend:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 그 밖의 주소는 파일이 있으면 그 파일을, 없으면 index.html을 준다 (React Router가 화면을 고름)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html은 새 빌드의 JS/CSS 파일 이름을 알려주는 파일이라, 브라우저가 쓸 때마다 서버에 바뀌었는지 확인하게 한다.
    # 이게 없으면 배포한 뒤에도 브라우저가 예전 index.html을 그대로 써서 옛 화면이 보인다
    # (JS/CSS는 내용이 바뀌면 파일 이름의 해시도 바뀌어서 따로 막지 않아도 된다)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}