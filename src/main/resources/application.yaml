server:
  port: 8082

spring:
  application:
    name: movie
  datasource:
    url: jdbc:mysql://localhost:3306/movie
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
