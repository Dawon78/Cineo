server:
  port: 8082

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1800000    # 30분 (ms 단위)
  refresh-token-validity: 1209600000  # 14일 (ms 단위)

tmdb:
  api-key: ${TMDB_API_KEY}

portone:
  api-key: ${PORTONE_API_KEY}
  api-secret: ${PORTONE_API_SECRET}

spring:
  application:
    name: movie
  datasource:
    url: jdbc:postgresql://localhost:5432/movie
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

