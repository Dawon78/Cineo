server:
  port: 8082

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1800000    # 30분 (ms 단위)
  refresh-token-validity: 1209600000  # 14일 (ms 단위)

tmdb:
  api-key: ${TMDB_API_KEY}

spring:
  application:
    name: movie
  datasource:
    url: jdbc:mysql://localhost:3306/movie
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

