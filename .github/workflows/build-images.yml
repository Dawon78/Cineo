# main에 코드가 합쳐질 때마다 GitHub 서버에서 Docker 이미지를 만들어 GHCR에 올린다
name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 프론트 이미지 빌드 후 업로드
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/dawon78/cineo-frontend:latest
            ghcr.io/dawon78/cineo-frontend:${{ github.sha }}
          build-args: |
            VITE_PORTONE_IMP_CODE=${{ vars.VITE_PORTONE_IMP_CODE }}
            VITE_PORTONE_CHANNEL_KEY=${{ vars.VITE_PORTONE_CHANNEL_KEY }}
  

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 백엔드 이미지 빌드 후 업로드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dawon78/cineo-backend:latest
            ghcr.io/dawon78/cineo-backend:${{ github.sha }}
            

  deploy:
    # 두 이미지가 모두 GHCR에 올라간 다음에 서버에 배포한다
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: 이 컴퓨터의 공인 IP 확인
        id: ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: AWS 로그인
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: 보안 그룹에 이 IP만 SSH 잠깐 열기
        run: >
          aws ec2 authorize-security-group-ingress
          --group-id ${{ vars.AWS_SG_ID }}
          --protocol tcp --port 22
          --cidr ${{ steps.ip.outputs.ip }}/32

      - name: 서버에서 새 이미지 받아 교체
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Cineo
            git pull
            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: 열었던 SSH 다시 닫기
        if: always()
        run: >
          aws ec2 revoke-security-group-ingress
          --group-id ${{ vars.AWS_SG_ID }}
          --protocol tcp --port 22
          --cidr ${{ steps.ip.outputs.ip }}/32