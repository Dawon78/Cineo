# main에 코드가 합쳐질 때마다 GitHub 서버에서 Docker 이미지를 만들어 GHCR에 올린다
name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 프론트 이미지 빌드 후 업로드
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/dawon78/cineo-frontend:latest
            ghcr.io/dawon78/cineo-frontend:${{ github.sha }}
          build-args: |
            VITE_PORTONE_IMP_CODE=${{ vars.VITE_PORTONE_IMP_CODE }}
            VITE_PORTONE_CHANNEL_KEY=${{ vars.VITE_PORTONE_CHANNEL_KEY }}